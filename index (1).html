<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spanish Level Test · A1 to C2 with listening</title>
<meta name="description" content="A free 33-question Spanish placement test with a listening section. Find your CEFR level (A1–C2). Interface in English, French and Arabic.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231F3FD1'/><text x='50' y='67' font-size='56' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>¿?</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6FB; --card:#FFFFFF; --ink:#0F1733; --muted:#5B6485;
  --brand:#1F3FD1; --brand-dark:#142A91; --brand-soft:#E3E8FB;
  --sun:#FFB81C; --line:#D5DBEE; --radius:14px;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Bricolage Grotesque","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
  font-size:18px;line-height:1.5;min-height:100vh}
main{max-width:680px;margin:0 auto;padding:24px 20px 64px}
h1,h2{line-height:1.12;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hidden{display:none!important}

/* top bar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px;font-weight:700;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:19px}
.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;font-style:normal;font-size:15px}
.right{display:flex;align-items:center;gap:12px}
#clock{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.langs{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.langs button{border:0;background:transparent;padding:6px 12px;font-weight:700;font-size:15px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--brand);color:#fff}

/* intro */
.hero h1{font-size:clamp(38px,8.5vw,64px);font-weight:800;letter-spacing:-.03em;margin-bottom:16px}
html[dir="rtl"] .hero h1{letter-spacing:0;line-height:1.25}
.hero p{color:var(--muted);max-width:54ch;margin:0 0 14px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.facts div{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.facts b{display:block;font-size:26px;letter-spacing:-.02em}
.facts span{font-size:14px;color:var(--muted)}
.rules{padding-inline-start:22px;color:var(--muted);font-size:16px;margin:0 0 22px}
.rules li{margin-bottom:6px}
.sound{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:22px}
.sound h2{font-size:19px;margin-bottom:12px}
.sound .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.choice{display:grid;gap:8px;margin-top:14px}
.choice label{display:flex;gap:10px;align-items:center;font-size:16px;cursor:pointer}
.choice input{width:20px;height:20px;accent-color:var(--brand)}
.warn{background:#FFF6D8;border-inline-start:4px solid var(--sun);padding:12px 14px;border-radius:8px;font-size:15px;margin-bottom:22px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:15px 28px;font-weight:700;font-size:18px;transition:background .15s,transform .1s}
.btn:hover{background:var(--brand-dark)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:#B9C0DD;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.small{padding:10px 18px;font-size:16px}

/* level ladder */
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:24px;direction:ltr}
.ladder div{position:relative;height:42px;border-radius:9px;background:var(--brand-soft);display:grid;place-items:center;
  font-weight:700;font-size:14px;color:var(--muted);overflow:hidden}
.ladder div::before{content:"";position:absolute;inset:0;background:var(--brand);transform-origin:left;transform:scaleX(var(--fill,0));transition:transform .35s ease}
.ladder span{position:relative;z-index:1;transition:color .2s}
.ladder div.on{box-shadow:0 0 0 3px var(--sun)}
.ladder div.done span,.ladder div.on.half span{color:#fff}

/* question */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.hint{font-size:15px;color:var(--muted);margin:0 0 14px}
.passage{direction:ltr;text-align:left;border-left:4px solid var(--sun);background:#FFF9E2;padding:14px 16px;margin:0 0 18px;border-radius:0 10px 10px 0;font-size:17px}
.stem{direction:ltr;text-align:left;font-size:clamp(22px,5vw,29px);font-weight:700;letter-spacing:-.015em;margin:0 0 22px}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--brand);margin:0 2px}
.player{display:flex;align-items:center;gap:16px;margin:0 0 22px;padding:16px;background:var(--brand-soft);border-radius:12px}
.play{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center;transition:background .15s}
.play:hover:not(:disabled){background:var(--brand-dark)}
.play:disabled{background:#A9B3DA;cursor:not-allowed}
.play svg{width:26px;height:26px;fill:currentColor}
.pinfo{font-size:15px;color:var(--ink);font-weight:500}
.pinfo small{display:block;color:var(--muted);font-weight:400}
.wave{display:flex;gap:3px;align-items:center;height:22px;margin-top:6px}
.wave i{width:4px;height:6px;border-radius:2px;background:var(--brand);opacity:.35}
.playing .wave i{opacity:1;animation:bounce .8s ease-in-out infinite}
.playing .wave i:nth-child(2){animation-delay:.1s}.playing .wave i:nth-child(3){animation-delay:.2s}
.playing .wave i:nth-child(4){animation-delay:.3s}.playing .wave i:nth-child(5){animation-delay:.4s}
@keyframes bounce{0%,100%{height:6px}50%{height:22px}}
.opts{direction:ltr;display:grid;gap:10px;border:0;padding:0;margin:0}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.opt label{display:flex;gap:12px;align-items:center;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:19px;transition:border-color .12s,background .12s}
.opt label:hover{border-color:#9AA8E8}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:14px;font-weight:700}
.opt input:checked+label{border-color:var(--brand);background:var(--brand-soft)}
.opt input:checked+label .k{background:var(--brand);color:#fff}
.opt input:focus-visible+label{outline:3px solid var(--sun);outline-offset:2px}
.opt.skip label{font-size:16px;color:var(--muted);border-style:dashed}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}
.count{color:var(--muted);font-size:15px}

/* results */
.res-top{background:var(--brand);color:#fff;border-radius:var(--radius);padding:28px 24px;margin-bottom:18px}
.res-top small{opacity:.85;font-size:16px}
.res-top .lvl{font-size:clamp(72px,22vw,124px);font-weight:800;letter-spacing:-.05em;line-height:.95;margin:6px 0 10px;direction:ltr;text-align:start}
.res-top .lvl em{font-style:normal;color:var(--sun)}
.res-top p{margin:0;max-width:48ch}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;margin-bottom:18px}
.panel h2{font-size:22px;margin-bottom:14px}
.row2{display:grid;grid-template-columns:minmax(34px,auto) 1fr auto;gap:12px;align-items:center;margin-bottom:10px;font-size:16px}
.row2 .name{font-weight:700;min-width:34px}
.row2.wide{grid-template-columns:150px 1fr auto}
.track{height:14px;background:var(--brand-soft);border-radius:8px;overflow:hidden;direction:ltr}
.track i{display:block;height:100%;background:var(--brand);border-radius:8px}
.row2.na .track i{background:#C7CDE4}
.row2 .val{color:var(--muted);text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.small{font-size:15px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

@media (max-width:480px){
  body{font-size:17px}
  .facts{gap:6px}.facts div{padding:10px}.facts b{font-size:21px}
  .q{padding:18px 16px}
  .row2.wide{grid-template-columns:110px 1fr auto}
}
@media print{
  .bar .right,.actions{display:none}
  body{background:#fff}
  .res-top{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="bar">
    <div class="brand"><i aria-hidden="true">¿?</i> <span data-i="brand"></span></div>
    <div class="right">
      <div class="langs" id="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="fr" aria-pressed="false">FR</button>
        <button type="button" data-lang="ar" aria-pressed="false">عربي</button>
      </div>
      <div id="clock" class="hidden">0:00</div>
    </div>
  </div>

  <!-- INTRO -->
  <section id="intro" class="hero">
    <h1 data-i="h1"></h1>
    <p data-i="lead"></p>
    <div class="facts">
      <div><b>33</b><span data-i="f1"></span></div>
      <div><b>~15</b><span data-i="f2"></span></div>
      <div><b>A1–C2</b><span data-i="f3"></span></div>
    </div>
    <ul class="rules">
      <li data-i="r1"></li><li data-i="r2"></li><li data-i="r3"></li><li data-i="r4"></li>
    </ul>

    <div class="sound" id="soundBox">
      <h2 data-i="sc_title"></h2>
      <div class="row">
        <button type="button" class="btn small ghost" id="sample" data-i="sc_play"></button>
      </div>
      <div class="choice">
        <label><input type="radio" name="snd" value="ok"> <span data-i="sc_ok"></span></label>
        <label><input type="radio" name="snd" value="no"> <span data-i="sc_no"></span></label>
      </div>
    </div>
    

    <button class="btn" id="start" data-i="start" disabled></button>
  </section>

  <!-- TEST -->
  <section id="test" class="hidden" aria-live="polite">
    <div class="ladder" id="ladder" aria-hidden="true"></div>
    <div class="q">
      <p class="hint" id="hint"></p>
      <div class="player hidden" id="player">
        <button type="button" class="play" id="play" aria-label="Play audio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="pinfo"><span id="pLabel"></span><small id="pLeft"></small><div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
      </div>
      <blockquote class="passage hidden" id="passage" lang="es"></blockquote>
      <h2 class="stem" id="stem" lang="es"></h2>
      <fieldset class="opts" id="opts"><legend class="hidden">Choose one answer</legend></fieldset>
      <div class="nav">
        <span class="count" id="count"></span>
        <button class="btn" id="next" disabled></button>
      </div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="res-top">
      <small data-i="est"></small>
      <div class="lvl" id="rLevel"></div>
      <p id="rDesc"></p>
    </div>
    <div class="panel">
      <h2 data-i="byLevel"></h2>
      <div id="rBars"></div>
      <p class="small" id="rMeta" style="margin-bottom:0"></p>
    </div>
    <div class="panel">
      <h2 data-i="bySkill"></h2>
      <div id="rSkills"></div>
    </div>
    <div class="panel">
      <h2 data-i="howTitle"></h2>
      <p class="small" style="margin:0" data-i="how"></p>
    </div>
    <div class="actions">
      <button class="btn" id="copy"></button>
      <button class="btn ghost" id="print"></button>
      <button class="btn ghost" id="retake"></button>
    </div>
  </section>
</main>

  var s=(T[lang]&&T[lang][k])||T.en[k]||k;

  return s;
}

Q.forEach(function(x){x.a=0});

/* ================= Helpers ================= */
var $=function(id){return document.getElementById(id)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp}return a}
function fmt(s){var m=Math.floor(s/60),r=s%60;return m+":"+(r<10?"0":"")+r}
function show(id){["intro","test","results"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)});window.scrollTo(0,0)}

/* ================= Speech (text-to-speech) ================= */
var ttsOK=("speechSynthesis" in window)&&(typeof SpeechSynthesisUtterance!=="undefined");
var voices=[];
function loadVoices(){if(ttsOK)voices=window.speechSynthesis.getVoices()||[]}
if(ttsOK){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(){
  var es=voices.filter(function(v){return /^es[-_]ES/i.test(v.lang)});
  var mx=voices.filter(function(v){return /^es[-_](MX|US|419)/i.test(v.lang)});
  var any=voices.filter(function(v){return /^es/i.test(v.lang)});
  return es[0]||mx[0]||any[0]||null;
}
function speak(text,rate,done){
  window.speechSynthesis.cancel();
  setTimeout(function(){
    var u=new SpeechSynthesisUtterance(text);
    var v=pickVoice();
    if(v){u.voice=v;u.lang=v.lang}else u.lang="es-ES";
    u.rate=rate||0.95;
    var fin=false;function end(){if(fin)return;fin=true;done&&done()}
    u.onend=end;u.onerror=end;
    window.speechSynthesis.speak(u);
  },60);
}
function stopSpeech(){if(ttsOK)window.speechSynthesis.cancel()}

/* Plays audio/<name>.mp3 if it exists (human recording); otherwise falls back to the browser voice */
var currentClip=null;
function playClip(name,text,rate,done){
  done=done||function(){};
  if(currentClip){try{currentClip.pause()}catch(e){}currentClip=null}
  var a=new Audio("audio/"+name+".mp3"),handled=false;
  currentClip=a;
  function fallback(){
    if(handled)return;handled=true;
    if(ttsOK)speak(text,rate,done);else done();
  }
  a.addEventListener("ended",function(){if(!handled){handled=true;done()}});
  a.addEventListener("error",fallback);
  var pr=a.play();
  if(pr&&pr.catch)pr.catch(fallback);
}
function stopAll(){
  if(currentClip){try{currentClip.pause()}catch(e){}currentClip=null}
  stopSpeech();
}

/* ================= Language switching ================= */
function applyLang(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=t("brand");
  document.querySelectorAll("[data-i]").forEach(function(el){el.textContent=t(el.getAttribute("data-i"))});
  document.querySelectorAll("#langs button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===lang?"true":"false")});
  $("copy").textContent=t("copy");$("print").textContent=t("print");$("retake").textContent=t("retake");
}
document.querySelectorAll("#langs button").forEach(function(b){
  b.addEventListener("click",function(){lang=b.dataset.lang;applyLang()});
});

/* ================= Intro: sound check ================= */
var listeningOn=false;
function updateStart(){
  var c=document.querySelector('input[name="snd"]:checked');
  $("start").disabled=!c;
}
$("sample").addEventListener("click",function(){
  playClip("sample","Hola. ¿Me oyes bien? Elige una respuesta abajo.",0.9);
});
document.querySelectorAll('input[name="snd"]').forEach(function(r){r.addEventListener("change",updateStart)});

/* ================= Test state ================= */
var order,idx,stats,skills,startT,timer,selected,playsLeft,playing;

function build(){
  var pool=Q.filter(function(x){return listeningOn||!x.au});
  order=[];
  LEVELS.forEach(function(L){order=order.concat(shuffle(pool.filter(function(x){return x.l===L})))});
  idx=0;stats={};
  LEVELS.forEach(function(L){stats[L]={total:pool.filter(function(x){return x.l===L}).length,seen:0,right:0}});
  skills={read:{seen:0,right:0},listen:{seen:0,right:0}};
}

function drawLadder(){
  var cur=order[idx]?order[idx].l:null,h="";
  LEVELS.forEach(function(L){
    var s=stats[L],fill=s.total?s.seen/s.total:0,cls="";
    if(fill>=1)cls="done";
    if(L===cur)cls+=" on"+(fill>0.5?" half":"");
    h+='<div class="'+cls+'" style="--fill:'+fill+'"><span>'+L+'</span></div>';
  });
  $("ladder").innerHTML=h;
}

function updatePlayer(){
  var p=$("player");
  p.classList.toggle("playing",!!playing);
  $("play").disabled=playing||playsLeft<=0;
  $("pLabel").textContent=playing?t("playing"):(playsLeft===2?t("play"):t("replay"));
  $("pLeft").textContent=t("left",{n:playsLeft});
  $("play").setAttribute("aria-label",$("pLabel").textContent);
}

function render(){
  var item=order[idx];selected=null;stopAll();playing=false;playsLeft=2;
  $("next").disabled=true;
  $("hint").textContent=item.au?t("listen"):(item.p?t("read"):t("choose"));
  var pe=$("passage");
  if(item.p){pe.textContent=item.p;pe.classList.remove("hidden")}else pe.classList.add("hidden");
  if(item.au){$("player").classList.remove("hidden");updatePlayer()}else $("player").classList.add("hidden");

  var stem=$("stem");stem.innerHTML="";
  item.q.split("___").forEach(function(part,pi,arr){
    stem.appendChild(document.createTextNode(part));
    if(pi<arr.length-1){var b=document.createElement("span");b.className="blank";b.innerHTML="&nbsp;";stem.appendChild(b)}
  });

  var opts=$("opts");
  opts.querySelectorAll(".opt").forEach(function(n){n.remove()});
  var mixed=shuffle(item.o.map(function(txt,i){return{t:txt,c:i===item.a}}));
  mixed.push({t:t("dk"),c:false,skip:true});
  mixed.forEach(function(o,i){
    var w=document.createElement("div");w.className="opt"+(o.skip?" skip":"");
    var inp=document.createElement("input");inp.type="radio";inp.name="ans";inp.id="o"+i;
    var lab=document.createElement("label");lab.htmlFor=inp.id;
    var k=document.createElement("span");k.className="k";k.textContent=o.skip?"–":String(i+1);
    var tx=document.createElement("span");tx.textContent=o.t;
    if(!o.skip)tx.lang="es";else tx.dir="auto";
    lab.appendChild(k);lab.appendChild(tx);w.appendChild(inp);w.appendChild(lab);opts.appendChild(w);
    inp.addEventListener("change",function(){selected=o.c;$("next").disabled=false});
  });
  $("count").textContent=t("qn",{a:idx+1,b:order.length});
  $("next").textContent=idx===order.length-1?t("see"):t("next");
  drawLadder();
}

$("play").addEventListener("click",function(){
  var item=order[idx];
  if(!item||!item.au||playing||playsLeft<=0)return;
  playsLeft--;playing=true;updatePlayer();
  var mine=idx;
  playClip(item.f,item.au,item.r,function(){if(idx===mine){playing=false;updatePlayer()}});
});

/* ================= Scoring ================= */
function placement(){
  var reached="Pre-A1";
  for(var i=0;i<LEVELS.length;i++){
    var s=stats[LEVELS[i]];
    if(s.seen<s.total)break;
    if(s.right/s.total>=0.6)reached=LEVELS[i];else break;
  }
  return reached;
}

function next(){
  var item=order[idx],s=stats[item.l],sk=item.au?skills.listen:skills.read;
  s.seen++;sk.seen++;
  if(selected){s.right++;sk.right++}
  idx++;
  var finished=(idx>=order.length)||(order[idx].l!==item.l);
  if(finished&&s.right/s.total<0.4)idx=order.length;   /* early stop */
  if(idx>=order.length){finish();return}
  render();
}

function barRow(name,val,pct,na,wide){
  return '<div class="row2'+(na?' na':'')+(wide?' wide':'')+'"><span class="name">'+name+'</span><div class="track"><i style="width:'+pct+'%"></i></div><span class="val">'+val+'</span></div>';
}

function finish(){
  stopAll();clearInterval(timer);
  var secs=Math.round((Date.now()-startT)/1000);
  var lvl=placement(),i=LEVELS.indexOf(lvl),nxt=LEVELS[i+1],plus="";
  if(nxt&&stats[nxt].seen>0){var p=stats[nxt].right/stats[nxt].total;if(p>=0.4&&p<0.6)plus="+"}
  $("rLevel").innerHTML=lvl+(plus?"<em>+</em>":"");
  $("rDesc").textContent=t("d_"+lvl)+(plus?" "+t("plus"):"");

  var bars="",R=0,S=0;
  LEVELS.forEach(function(L){
    var s=stats[L];R+=s.right;S+=s.seen;
    if(!s.seen)bars+=barRow(L,t("notReached"),0,true);
    else bars+=barRow(L,s.right+"/"+s.total,Math.round(s.right/s.total*100));
  });
  $("rBars").innerHTML=bars;
  $("rMeta").textContent=t("meta",{r:R,s:S,t:fmt(secs)});

  var sk="";
  var rd=skills.read,ls=skills.listen;
  sk+=barRow(t("skillRead"),rd.right+"/"+rd.seen,rd.seen?Math.round(rd.right/rd.seen*100):0,!rd.seen,true);
  if(listeningOn&&ls.seen)sk+=barRow(t("skillListen"),ls.right+"/"+ls.seen,Math.round(ls.right/ls.seen*100),false,true);
  else sk+=barRow(t("skillListen"),t("skipped"),0,true,true);
  $("rSkills").innerHTML=sk;

  window._summary=t("summary",{l:lvl+plus,r:R,s:S});
  $("clock").classList.add("hidden");
  $("langs").classList.remove("hidden");
  show("results");
}

function start(){
  var c=document.querySelector('input[name="snd"]:checked');
  listeningOn=!!(c&&c.value==="ok");
  build();
  $("langs").classList.add("hidden");
  show("test");
  $("clock").classList.remove("hidden");$("clock").textContent="0:00";
  startT=Date.now();clearInterval(timer);
  timer=setInterval(function(){$("clock").textContent=fmt(Math.round((Date.now()-startT)/1000))},1000);
  render();
}

/* ================= Events ================= */
$("start").addEventListener("click",start);
$("retake").addEventListener("click",function(){
  show("intro");
});
$("next").addEventListener("click",next);
$("print").addEventListener("click",function(){window.print()});
$("copy").addEventListener("click",function(){
  var b=this,txt=window._summary||"";
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){b.textContent=t("copied")},function(){b.textContent=t("failed")});
  setTimeout(function(){b.textContent=t("copy")},1800);
});
document.addEventListener("keydown",function(e){
  if($("test").classList.contains("hidden"))return;
  if(e.key>="1"&&e.key<="5"){var el=$("o"+(+e.key-1));if(el){el.checked=true;el.dispatchEvent(new Event("change"))}}
  if(e.key==="0"||e.key==="-"){var all=document.querySelectorAll("#opts input");var l=all[all.length-1];if(l){l.checked=true;l.dispatchEvent(new Event("change"))}}
  if(e.key==="Enter"&&!$("next").disabled){e.preventDefault();next()}
});
window.addEventListener("beforeunload",function(e){
  if(!$("test").classList.contains("hidden")){e.preventDefault();e.returnValue=""}
});

applyLang();updateStart();
})();
</script>
